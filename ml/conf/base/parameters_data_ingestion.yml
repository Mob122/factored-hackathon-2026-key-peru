# Parameters for the 'data_ingestion' pipeline.
#
# raw_root: directory holding the untouched S3 dump (relative to ml/).
# tables: glob of each table's CSV files, relative to raw_root. Fact tables are
# Hive-partitioned daily: <table>/year=YYYY/month=MM/day=DD/<table>_YYYYMMDD.csv
data_ingestion:
  raw_root: data/01_raw
  tables:
    customers: customers.csv
    products: products.csv
    branches: branches.csv
    service_agents: service_agents.csv
    marketing_campaigns: marketing_campaigns.csv
    daily_exchange_rates: daily_exchange_rates.csv
    transactions: transactions/**/*.csv
    call_center_interactions: call_center_interactions/**/*.csv
    call_transcripts: call_transcripts/**/*.csv
    satisfaction_surveys: satisfaction_surveys/**/*.csv
    digital_events: digital_events/**/*.csv
    complaints: complaints/**/*.csv
    campaign_sends: campaign_sends/**/*.csv
