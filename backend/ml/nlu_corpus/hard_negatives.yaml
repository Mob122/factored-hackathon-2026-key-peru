    intent: block_reason
    slots: {product_kind: card}
    es-CO:
      - "Me bloquearon la tarjeta y no sé por qué."
      - "Me bloquearon la tarjeta sin avisarme, ¿qué pasó?"
      - "Mi tarjeta amaneció bloqueada y no entiendo el motivo."
