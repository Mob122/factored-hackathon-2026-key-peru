    intent: block_reason
    slots: {product_kind: card}
    es-MX:
      - "¿Por qué está bloqueada mi tarjeta?"
      - "¿Cuál es la razón de que mi tarjeta esté bloqueada?"
      - "¿Por qué tengo bloqueada la tarjeta, me explica?"
