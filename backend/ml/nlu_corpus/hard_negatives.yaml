# docs/intents.md section 5: each hard negative verbatim plus 2 paraphrases in the same
# variant that keep its label. Train split only.
groups:
  - id: hn-01
    intent: card_status
    slots: {product_kind: card}
    es-MX:
      - "¿Mi tarjeta está bloqueada?"
      - "¿Tengo la tarjeta bloqueada?"
      - "Oiga, ¿mi tarjeta aparece como bloqueada?"
